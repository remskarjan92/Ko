  <script>
    // ─── Self-diagnosing boot screen ──────────────────────────────────────────
    // If the app never renders (CDN failure, JS error, etc.), this shows a plain-text
    // diagnostic directly on the page — no devtools needed, works on any device.
    window.__diag = [];
    function diagLog(msg, ok) {
      window.__diag.push({ msg, ok: !!ok, t: Date.now() });
    }
    window.__appRendered = false;
    window.addEventListener("error", function(e) {
      diagLog("JS Error: " + (e.message || e.error?.message || "unknown") + (e.filename ? " @ " + e.filename + ":" + e.lineno : ""));
      showDiagIfNeeded();
    });
    window.addEventListener("unhandledrejection", function(e) {
      diagLog("Unhandled Promise Rejection: " + (e.reason?.message || e.reason));
      showDiagIfNeeded();
    });
    function showDiagIfNeeded() {
      if (window.__appRendered) {
        var renderedOverlay = document.getElementById("diag-overlay");
        if (renderedOverlay) renderedOverlay.style.display = "none";
        return;
      }
      var root = document.getElementById("root");
      if (root && root.children.length > 0) return; // app rendered fine, don't show
      var overlay = document.getElementById("diag-overlay");
      if (!overlay) return;
      overlay.innerHTML = "<h2>⚠ App failed to load</h2>" +
        window.__diag.map(function(d) {
          return "<div class='diag-line" + (d.ok ? " diag-ok" : "") + "'>" + d.msg + "</div>";
        }).join("") +
        "<div class='diag-line'>Screenshot this and send it — it tells us exactly what broke.</div>";
      overlay.style.display = "block";
    }
    function markAppRendered() {
      window.__appRendered = true;
      diagLog("App rendered", true);
      var overlay = document.getElementById("diag-overlay");
      if (overlay) overlay.style.display = "none";
    }
    // Mobile browsers can spend several seconds downloading and transforming the inline JSX.
    setTimeout(function() {
      var root = document.getElementById("root");
      if (!window.__appRendered && (!root || root.children.length === 0)) {
        diagLog("Timeout: app did not render within 25s. Root element is empty.");
        showDiagIfNeeded();
      }
    }, 25000);
  </script>

  async function compressImageDataUrl(dataUrl, {
    maxSize = 1024,
    quality = 0.88,
    mimeType = "image/webp"
  } = {}) {
    if (!dataUrl) return "";
    const img = new Image();
    img.decoding = "async";
    const loaded = new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
    });
    img.src = dataUrl;
    await loaded;
    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
    const width = Math.max(1, Math.round(img.width * scale));
    const height = Math.max(1, Math.round(img.height * scale));
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, width, height);
