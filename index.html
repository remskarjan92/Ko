// ─── Parse batch output ───────────────────────────────────────────────────────
// FIX: now parses MANUAL_FIX_TEMPLATE as a multi-line block
function parseBatch(raw) {
  return raw.split("---MOCKUP_START---").slice(1).map(block => {
    const s = block.split("---MOCKUP_END---")[0].trim();

    // For single-line fields
    const getLine = k => {
      const m = s.match(new RegExp(`^${k}:\\s*(.+)$`, "m"));
      return m ? m[1].trim() : "";
    };

    // For multi-line fields (up to next ALL_CAPS field or end)
    const getBlock = k => {
      const m = s.match(new RegExp(`${k}:\\s*([\\s\\S]*?)(?=\\n[A-Z_]+:|---MOCKUP_END---|$)`));
      return m ? m[1].trim() : "";
    };

    // Manual fix template: parse its sub-fields
    const mftRaw = getBlock("MANUAL_FIX_TEMPLATE");
    const mftField = k => {
      const m = mftRaw.match(new RegExp(`${k}:\\s*(.+)`));
      return m ? m[1].trim() : "";
    };

    return {
      category:         getLine("CATEGORY"),
      primaryColor:     getLine("SHIRT_COLOR_PRIMARY"),
      secondaryColor:   getLine("SHIRT_COLOR_SECONDARY"),
      colorReasoning:   getLine("COLOR_REASONING"),
      categoryResearch: getBlock("CATEGORY_RESEARCH"),
      categoryKeywords: getBlock("CATEGORY_KEYWORDS"),
      shirtResearch:    getBlock("SHIRT_RESEARCH"),
      fluxPrompt:       getBlock("FLUX_PROMPT"),
      negativePrompt:   getBlock("NEGATIVE_PROMPT"),
      qaChecklist:      getBlock("QA_CHECKLIST"),
      autoFix:          getBlock("AUTO_FIX_PROMPT"),
      thumbnailNotes:   getBlock("THUMBNAIL_NOTES"),
      // FIX: Manual fix template now parsed and stored
      manualFix: {
        issue:       mftField("Issue"),
        targetArea:  mftField("Target Area"),
        correction:  mftField("Desired Correction"),
        preserve:    mftField("Elements To Preserve"),
        strength:    mftField("Correction Strength"),
      },
    };
  });
}

// ─── API helpers ──────────────────────────────────────────────────────────────
function getAdminToken() {
  return localStorage.getItem(ADMIN_TOKEN_STORAGE_KEY) || "";
}

function setAdminToken(token) {
  if (token) localStorage.setItem(ADMIN_TOKEN_STORAGE_KEY, token);
  else localStorage.removeItem(ADMIN_TOKEN_STORAGE_KEY);
}

function authHeaders() {
  const token = getAdminToken();
  return token ? { "x-admin-token": token } : {};
}

async function compressImageDataUrl(dataUrl, { maxSize = 1024, quality = 0.88, mimeType = "image/webp" } = {}) {
  if (!dataUrl) return "";

  const img = new Image();
  img.decoding = "async";

  const loaded = new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
  });

  img.src = dataUrl;
  await loaded;

  const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
  const width = Math.max(1, Math.round(img.width * scale));
  const height = Math.max(1, Math.round(img.height * scale));

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, width, height);

  return canvas.toDataURL(mimeType, quality);
}

async function authedFetch(path, options = {}) {
  const headers = { ...(options.headers || {}), ...authHeaders() };
  return fetch(path, { ...options, headers });
}

async function apiFetch(path, body) {
  const res = await authedFetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const d = await res.json();
  if (!res.ok) throw new Error(d.error || `Server error ${res.status}`);
  return d;
}

function dataUrlToBlob(dataUrl) {
  const [meta, base64] = dataUrl.split(",");
  const mime = meta.match(/data:(.*?);base64/)?.[1] || "image/webp";
  const bytes = atob(base64);
  const array = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) array[i] = bytes.charCodeAt(i);
  return new Blob([array], { type: mime });
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadJsonStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed ?? fallback;
  } catch {
    return fallback;
  }
}

function saveJsonStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {}
}

function makePromptId() {
  return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

function loadPromptRatings() {
  const records = loadJsonStorage(PROMPT_RATINGS_STORAGE_KEY, []);
  return Array.isArray(records) ? records : [];
}

function loadLearningEnabled() {
  return loadJsonStorage(PROMPT_LEARNING_ENABLED_KEY, true) !== false;
}

function upsertPromptRating(records, next) {
  const rating = Math.max(0, Math.min(5, Number(next.rating) || 0));
  const clean = {
    ...next,
    rating,
    promptId: next.promptId,
    updatedAt: new Date().toISOString(),
  };
  const existingIndex = records.findIndex(r => r.promptId === clean.promptId);
  if (!rating) {
    return existingIndex >= 0 ? records.filter(r => r.promptId !== clean.promptId) : records;
  }
  if (existingIndex >= 0) {
    const prev = records[existingIndex];
    const merged = { ...prev, ...clean, createdAt: prev.createdAt || clean.createdAt || new Date().toISOString() };
    return records.map(r => r.promptId === clean.promptId ? merged : r);
  }
  return [...records, { ...clean, createdAt: clean.createdAt || new Date().toISOString() }];
}

function aggregateRatingGroups(records, key) {
  const groups = new Map();
  records.forEach(record => {
    if (!record.rating) return;
    const value = (record[key] || "").trim();
    if (!value) return;
    const current = groups.get(value) || { label: value, sum: 0, count: 0 };
    current.sum += Number(record.rating) || 0;
    current.count += 1;
    groups.set(value, current);
  });
  return Array.from(groups.values())
    .map(item => ({ ...item, avg: item.count ? item.sum / item.count : 0 }))
    .sort((a, b) => b.avg - a.avg || b.count - a.count)
    .slice(0, 3);
}

function buildLearningStats(records) {
  const rated = records.filter(r => Number(r.rating) > 0);
  const learned = records.filter(r => Number(r.rating) >= 4);
  const total = rated.length;
  const avg = total ? (rated.reduce((sum, r) => sum + Number(r.rating || 0), 0) / total).toFixed(1) : "0.0";
  const strong = learned.length;
  const cat = aggregateRatingGroups(records, "categoryName");
  const aud = aggregateRatingGroups(records, "audience");
  const shirt = aggregateRatingGroups(records, "shirtType");
  const scene = aggregateRatingGroups(records, "sceneDirection");

  const learningContext = learned.length
    ? [
        `Use these high-rated patterns as soft preferences only:`,
        cat.length ? `Top categories: ${cat.map(item => item.label).join(", ")}.` : "",
        aud.length ? `Best audiences: ${aud.map(item => item.label).join(", ")}.` : "",
        shirt.length ? `Best shirt types: ${shirt.map(item => item.label).join(", ")}.` : "",
        scene.length ? `Best scene directions: ${scene.map(item => item.label).join(", ")}.` : "",
        `Keep the uploaded design, shirt identity, and category brief higher priority than any learned preference.`,
      ].filter(Boolean).join(" ")
    : "";

  return {
    total,
    avg,
    strong,
    cat,
    aud,
    shirt,
    scene,
    learningContext,
  };
}

    .then(r => {

        setInfo({ authRequired: true });
        return null;
      }
      return r.json();
    })
    .then(d => { if (d) setInfo(d); })

  useEffect(() => { loadInfo(); }, []);

  const si = s => s==="ok"?"✓" : s==="fail"?"✗" : s==="loading"?"…" : "";

    if (token) {
      setAdminToken(token);
      setAdminTokenValue(token);
      return token;
    }
    return getAdminToken();

    setAdminTokenValue(next);
    setAdminToken(next);

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [showSettings, setShowSettings] = useState(false);
  const [keyInfo,      setKeyInfo]      = useState(null);

  // FIX: mockupCount added back to form state
  const [form, setForm] = useState({
    brandStyle:"", niche:"", audience:"",
    shirtType:"__match_picture__",
    shirtModel:"", shirtName:"",
    sceneDirection:"",
    mockupCount: 18,
    autoDetect: true,
  });

  const [imageFile,    setImageFile]    = useState(null);
  const [imagePreview, setImagePreview] = useState(null);
  const [imageBase64,  setImageBase64]  = useState(null);
  const [referenceImages, setReferenceImages] = useState([]);
  const [designAnalysis, setDesignAnalysis] = useState("");
  const [analyzing, setAnalyzing] = useState(false);

  const [loading,   setLoading]   = useState(false);
  const [progress,  setProgress]  = useState(0);
  const [progLabel, setProgLabel] = useState("");
  const [results,   setResults]   = useState([]);
  const [openCard,  setOpenCard]  = useState(null);
  const [activeTab, setActiveTab] = useState("all");
  const [error,     setError]     = useState(null);
  const [imgStates, setImgStates] = useState({});
  const [customPrompts, setCustomPrompts] = useState({});
  const [genAllBusy,setGenAllBusy]= useState(false);
  const [promptRatings, setPromptRatings] = useState([]);
  const [learningEnabled, setLearningEnabled] = useState(true);

  const fileRef = useRef();
  const refsRef = useRef();

  useEffect(() => {
    authedFetch("/api/keys")
      .then(r => {
        if (r.status === 401) {
          setKeyInfo({ authRequired: true });
          return null;
        }
        return r.json();
      })
      .then(d => { if (d) setKeyInfo(d); })
      .catch(()=>{});
  }, []);

  useEffect(() => {
    setPromptRatings(loadPromptRatings());
    setLearningEnabled(loadLearningEnabled());
  }, []);

  useEffect(() => {
    saveJsonStorage(PROMPT_RATINGS_STORAGE_KEY, promptRatings);
  }, [promptRatings]);

  useEffect(() => {
    saveJsonStorage(PROMPT_LEARNING_ENABLED_KEY, learningEnabled);
  }, [learningEnabled]);

  const setImg = (id, patch) => setImgStates(s => ({...s, [id]:{...(s[id]||{}), ...patch}}));
  const setCustomPrompt = (id, value) => setCustomPrompts(s => ({...s, [id]: value}));
  const setPromptRating = (promptId, rating, meta = {}) => {
    setPromptRatings(records => {
      const next = upsertPromptRating(records, { promptId, rating, ...meta });
      return next;
    });
  };
  const resolveRegenerationPrompt = (id, override = "") => {
    const pieces = [
      override,
      customPrompts[id],
      imgStates[id]?.fixSuggestion,
    ].map(v => (v || "").trim()).filter(Boolean);
    return pieces[0] || "";
  };
  const resolvedShirtModel = () => {
    const raw = form.shirtModel.trim();
    const custom = form.shirtName.trim();
    if (form.shirtType === "__match_picture__") return custom || "Match the picture";
    return custom || raw || "Unisex Classic Tee";
  };
  const selectedCategories = () => ALL_BATCHES.flat().slice(0, form.mockupCount);
  const selectedBatches = () => {
    const cats = selectedCategories();
    const chunks = [];
    for (let i = 0; i < cats.length; i += 6) chunks.push(cats.slice(i, i + 6));
    return chunks;
  };
  const promptStats = buildLearningStats(promptRatings);
  const ratingByPromptId = promptRatings.reduce((acc, r) => {
    if (r?.promptId) acc[r.promptId] = r.rating;
    return acc;
  }, {});

  const handleFile = e => {
    const f = e.target.files[0]; if (!f) return;
    setImageFile(f);
    const r = new FileReader();
    r.onload = ev => { setImagePreview(ev.target.result); setImageBase64(ev.target.result.split(",")[1]); };
    r.readAsDataURL(f);
  };

  const handleReferenceFiles = async e => {
    const files = Array.from(e.target.files || []).slice(0, 3);
    const refs = await Promise.all(files.map(async file => {
      const dataUrl = await fileToDataUrl(file);
      const compressed = await compressImageDataUrl(dataUrl, {
        maxSize: 1024,
        quality: 0.86,
        mimeType: "image/png",
      });
      return { name: file.name, type: "image/png", dataUrl: compressed, base64: compressed.split(",")[1] };
    }));
    setReferenceImages(refs);
  };

  const analyzeDesign = async () => {
    if (!imageBase64) return "";
    setAnalyzing(true);
    try {
      const d = await apiFetch("/api/analyze-shirt", {
        imageBase64,
        imageType: imageFile?.type || "image/png",
      });
      setDesignAnalysis(d.analysis);
      return d.analysis;
    } finally {
      setAnalyzing(false);
    }
  };

  const handleGenerate = async () => {
    if (!imageBase64) { setError("Naloži grafiko najprej."); return; }
    setError(null); setLoading(true); setResults([]); setProgress(0); setOpenCard(null); setImgStates({}); setCustomPrompts({});

    const activeBatches = selectedBatches();
    const labels = [
      "Generiram flat lays in product posnetke…",
      "Generiram model in selfie posnetke…",
      "Generiram lifestyle in editorial posnetke…",
    ];

    const all = [];
    try {
      const analysis = form.autoDetect ? (designAnalysis || await analyzeDesign()) : "";
      const learningContext = learningEnabled ? promptStats.learningContext : "";
      for (let i = 0; i < activeBatches.length; i++) {
        setProgLabel(labels[i] || "Generiram dodatne mockupe…");
        const d = await apiFetch("/api/generate-prompts", {
          batch: activeBatches[i],
          imageBase64, imageType: imageFile.type || "image/png",
          brandStyle: form.brandStyle, niche: form.niche,
          audience: form.audience,
          shirtMode: form.shirtType,
          shirtModel: resolvedShirtModel(),
          shirtName: form.shirtName,
          designAnalysis: analysis,
          autoDetect: form.autoDetect,
          sceneDirection: form.sceneDirection, mockupCount: form.mockupCount,
          learningContext,
        });
        const parsed = parseBatch(d.raw);
        activeBatches[i].forEach((cat, j) => all.push({
          catInfo: cat,
          promptId: makePromptId(),
          meta: {
            categoryId: cat.id,
            categoryName: cat.name,
            niche: form.niche,
            audience: form.audience,
            shirtType: form.shirtType,
            shirtModel: resolvedShirtModel(),
            shirtName: form.shirtName,
            sceneDirection: form.sceneDirection,
            brandStyle: form.brandStyle,
            autoDetect: form.autoDetect,
            designAnalysis: analysis,
            generatedAt: new Date().toISOString(),
          },
          data: parsed[j] || { category: cat.name, fluxPrompt:"Napaka — poskusi znova", negativePrompt:"", qaChecklist:"", autoFix:"", thumbnailNotes:"", manualFix:{} },
        }));
        setResults([...all]);
        setProgress(((i+1)/activeBatches.length)*100);
      }

        maxSize: 1024,
        quality: 0.88,
        mimeType: "image/png",

      const d = await apiFetch("/api/generate-image", {
        fluxPrompt,
        customPrompt: resolvedCustom,
        designAnalysis,
        referenceImages: referenceImages.map(r => ({ imageBase64: r.base64, imageType: r.type, name: r.name })),
        imageBase64: compressed.split(",")[1],
        imageType: "image/png",
      });
      setImg(id, {status:"done", url:d.url, lastAction: resolvedCustom ? "regenerate_with_context" : "regenerate"});

CATEGORY RESEARCH:
${r.data.categoryResearch}

SEO KEYWORDS:
${r.data.categoryKeywords}

SHIRT RESEARCH:
${r.data.shirtResearch}

${r.data.fluxPrompt}

${r.data.thumbnailNotes}`;

            <div style={{display:"grid",gridTemplateColumns:`repeat(${selectedBatches().length},1fr)`,gap:6}}>
              {selectedBatches().map((b,bi)=>{
                const done=results.some(r=>r.catInfo?.id===b[0].id);
                return<div key={bi} style={{background:done?"rgba(255,220,100,0.07)":"rgba(255,255,255,0.02)",border:`1px solid ${done?"rgba(255,220,100,0.18)":"rgba(255,255,255,0.05)"}`,borderRadius:8,padding:"7px 10px"}}>
                  <div style={{fontSize:10,color:done?"#FFDC64":"rgba(255,255,255,0.22)",fontFamily:"'DM Mono',monospace"}}>{done?"✓ ":"· "}Serija {bi+1}</div>
                  <div style={{fontSize:9,color:"rgba(255,255,255,0.18)",marginTop:2}}>{b.map(c=>c.emoji).join(" ")}</div>
                </div>;
              })}
            </div>
          </div>
        )}

        {/* Results */}
        {results.length>0&&(
          <div style={{animation:"fadeUp 0.4s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:13}}>
              <div style={{fontSize:10,color:"rgba(255,220,100,0.6)",fontFamily:"'DM Mono',monospace",letterSpacing:"0.14em",textTransform:"uppercase"}}>✦ {results.length}/{total} promptov · {doneCount} slik</div>
              <div style={{display:"flex",gap:7}}>
                {doneCount>0&&<button onClick={downloadAll} style={{background:"linear-gradient(135deg,#7EE8A2,#38C77E)",border:"none",borderRadius:8,padding:"7px 12px",color:"#07100B",fontSize:10,fontFamily:"'DM Mono',monospace",cursor:"pointer",fontWeight:700}}>Download All Mockups</button>}
                {results.length===total&&<button onClick={copyAll} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:8,padding:"5px 11px",color:"rgba(255,255,255,0.45)",fontSize:10,fontFamily:"'DM Mono',monospace",cursor:"pointer"}}>Kopiraj vse</button>}
                {results.length===total&&(
                  <button onClick={handleGenAll} disabled={genAllBusy} style={{display:"flex",alignItems:"center",gap:5,background:genAllBusy?"rgba(255,220,100,0.04)":"rgba(255,220,100,0.12)",border:"1px solid rgba(255,220,100,0.25)",borderRadius:8,padding:"5px 12px",color:genAllBusy?"rgba(255,220,100,0.3)":"#FFDC64",fontSize:10,fontFamily:"'DM Mono',monospace",cursor:genAllBusy?"not-allowed":"pointer"}}>
                    {genAllBusy?<><Spinner size={11}/><span>Generiram…</span></>:<span>🖼 Generiraj vseh {total} slik</span>}
                  </button>
                )}
              </div>
            </div>

            {doneCount>0&&(
              <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:10,padding:"9px 13px",marginBottom:13}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                  <span style={{fontSize:10,color:"rgba(255,255,255,0.3)",fontFamily:"'DM Mono',monospace"}}>Generirane slike</span>
                  <span style={{fontSize:10,color:"#7EE8A2",fontFamily:"'DM Mono',monospace"}}>{doneCount} / {total}</span>
                </div>
                <div style={{background:"rgba(255,255,255,0.05)",borderRadius:999,height:3}}>
                  <div style={{height:"100%",background:"linear-gradient(90deg,#7EE8A2,#38C77E)",borderRadius:999,width:`${(doneCount/total)*100}%`,transition:"width 0.4s"}}/>
                </div>
              </div>
            )}

            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:13}}>
              {TABS.filter(t=>t.id==="all"||(t.ids&&t.ids.some(id=>results.some(r=>r.catInfo?.id===id)))).map(t=>(
                <button key={t.id} onClick={()=>setActiveTab(t.id)} style={{padding:"5px 12px",borderRadius:20,border:activeTab===t.id?"1.5px solid #FFDC64":"1.5px solid rgba(255,255,255,0.08)",background:activeTab===t.id?"rgba(255,220,100,0.1)":"transparent",color:activeTab===t.id?"#FFDC64":"rgba(255,255,255,0.32)",fontSize:11,cursor:"pointer",transition:"all 0.15s"}}>{t.label}</button>
              ))}
            </div>

            {filtered.map(r=>{
              const gi = results.indexOf(r);
              const id = r.catInfo?.id;
              const rating = ratingByPromptId[r.promptId] || 0;
              return <MockupCard key={id||gi} result={r.data} catInfo={r.catInfo} index={gi} isOpen={openCard===gi} onToggle={()=>setOpenCard(openCard===gi?null:gi)} imgState={imgStates[id]} customPrompt={customPrompts[id]} onCustomPrompt={value=>setCustomPrompt(id,value)} onGenImage={customPrompt=>genImage(id,r.data.fluxPrompt,customPrompt)} onAiFix={()=>aiFixSuggestion(id,r.data)} rating={rating} onRate={nextRating=>ratePrompt(r.promptId, nextRating, r.meta)}/>;
            })}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
